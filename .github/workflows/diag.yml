name: diag

# 一次性诊断：在 VPS 上跑 sqlite3 / systemctl 查询，输出到日志。
# 用完即删。

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run diagnostics on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ctrip' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
            set -uo pipefail
            echo "=== systemd timers ==="
            sudo systemctl is-active ctrip-scraper.timer ctrip-parser.timer ctrip-retention.timer ctrip-web.service 2>&1
            echo
            echo "=== recent scraper/parser journal ==="
            sudo journalctl -u ctrip-scraper -n 10 --no-pager 2>&1 | tail -30
            echo "---"
            sudo journalctl -u ctrip-parser -n 10 --no-pager 2>&1 | tail -30
            echo
            echo "=== rounds (by POI) ==="
            cd /opt/ctrip-price-monitor
            .venv/bin/python3 -c "
import sqlite3
c = sqlite3.connect('data/monitor.db'); c.row_factory = sqlite3.Row
for r in c.execute('SELECT poi_viewid, COUNT(*) n, MIN(captured_at) first, MAX(captured_at) last, GROUP_CONCAT(DISTINCT status) statuses FROM rounds GROUP BY poi_viewid ORDER BY poi_viewid'):
    print(dict(r))
print()
print('=== pois (enabled flag) ===')
for r in c.execute('SELECT viewid, name, enabled, last_status, last_error FROM pois ORDER BY viewid'):
    print(dict(r))
print()
print('=== cookies ===')
for r in c.execute('SELECT id, uploaded_at, source, substr(blob_json,1,30) as blob_head FROM cookies ORDER BY id DESC LIMIT 3'):
    print(dict(r))
print()
print('=== last 5 rounds (any status) ===')
for r in c.execute('SELECT id, poi_viewid, status, captured_at, received_at, sku_count, error_msg FROM rounds ORDER BY id DESC LIMIT 8'):
    print(dict(r))
print()
print('=== api_secret in DB vs .env ===')
import os
db_secret = c.execute(\"SELECT value FROM config WHERE key='api_secret'\").fetchone()
env_secret = open('.env').read().split('API_SECRET=')[1].split()[0] if 'API_SECRET=' in open('.env').read() else '(none)'
print('db:    ', db_secret['value'][:24]+'...' if db_secret else '(none)')
print('env:   ', env_secret[:24]+'...')
print('match:', db_secret['value'] == env_secret if db_secret else 'n/a')
" 2>&1
          REMOTE