name: vendor-add-16540

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH insert
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ctrip' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CTRIP_ADMIN_PASSWORD: ${{ secrets.CTRIP_ADMIN_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
            set -euo pipefail
            cd /opt/ctrip-price-monitor
            ADMIN_PWD="${CTRIP_ADMIN_PASSWORD}"
            VID="16540"
            LABEL="北京旭冉假期旅游有限公司"
            echo "admin pwd len: ${#ADMIN_PWD}, vid=$VID"

            .venv/bin/python - <<'PYEOF'
import os, urllib.parse, http.cookiejar, urllib.request, sys
ADMIN_PWD = os.environ["ADMIN_PWD"]
VID = os.environ["VID"]
LABEL = os.environ["LABEL"]
jar = http.cookiejar.CookieJar()
opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
opener.addheaders = [('User-Agent', 'workflow-vendor-add/1.0')]
data = urllib.parse.urlencode({"username": "admin", "password": ADMIN_PWD}).encode()
r = opener.open("http://127.0.0.1:8000/login", data=data)
print("login:", r.status)
sid = next((c.value for c in jar if c.name == "ctrip_sid"), None)
print("sid:", sid and sid[:8] + "...")
if not sid:
    sys.exit("no sid after login")
data = urllib.parse.urlencode({"vendor_id": VID, "label": LABEL}).encode()
r = opener.open("http://127.0.0.1:8000/admin/vendors/add", data=data)
print("add:", r.status, r.url)
PYEOF
REMOTE