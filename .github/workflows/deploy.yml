name: deploy

# 推送到 main → SSH 到 racknerd19 → 拉代码 → 重启服务
# 所需 secrets（gh repo edit 配置）:
#   VPS_SSH_KEY       private key (无 passphrase)
#   VPS_USER          默认 ctrip
#   VPS_HOST          默认 racknerd19 IP / hostname
#   API_SECRET        init_db 时生成，写入 config 表（admin 可在 /admin/api-secret 页面 rotate）
#   WEBHOOK_URL       告警回调 (可选)
#   WEBHOOK_SECRET    回调签名 (可选)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ctrip' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -avz --delete \
            --exclude '.venv' \
            --exclude '.ssh' \
            --exclude 'data/' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '_captures/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:/opt/ctrip-price-monitor/"

      - name: Apply env + restart on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ctrip' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          API_SECRET: ${{ secrets.API_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CTRIP_DB_PATH: /opt/ctrip-price-monitor/data/monitor.db
          CTRIP_RAW_DIR: /opt/ctrip-price-monitor/data/raw_rounds
          CTRIP_ADMIN_PASSWORD: ${{ secrets.CTRIP_ADMIN_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
            set -euo pipefail
            cd /opt/ctrip-price-monitor

            # 写 .env（从 GH secrets 注入；API_SECRET 仅用于首次 init_db）
            printf 'API_SECRET=%s\nWEBHOOK_URL=%s\nWEBHOOK_SECRET=%s\nCTRIP_DB_PATH=%s\nCTRIP_RAW_DIR=%s\n' \
              "${API_SECRET}" "${WEBHOOK_URL}" "${WEBHOOK_SECRET}" "${CTRIP_DB_PATH}" "${CTRIP_RAW_DIR}" \
              > .env
            chmod 600 .env

            # venv（如果还没有）
            if [[ ! -d .venv ]]; then
              sudo python3.11 -m venv .venv || python3 -m venv .venv
            fi
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt

            # service user（首次）
            if ! id -u ctrip >/dev/null 2>&1; then
              sudo useradd --system --shell /usr/sbin/nologin --home-dir /opt/ctrip-price-monitor ctrip || true
            fi
            sudo mkdir -p /opt/ctrip-price-monitor/data
            sudo chown -R ctrip:ctrip /opt/ctrip-price-monitor/data 2>/dev/null || true

            # systemd units
            sudo cp deploy/systemd/*.service deploy/systemd/*.timer /etc/systemd/system/
            sudo systemctl daemon-reload

            # 启动 / 重启 — 先彻底 kill 老 uvicorn（防 --workers 2 master 没死透）
            sudo pkill -9 -f 'uvicorn web.server:app' 2>/dev/null || true
            sudo systemctl enable --now ctrip-web.service
            sudo systemctl restart ctrip-web.service
            sudo systemctl enable ctrip-scraper.timer ctrip-parser.timer ctrip-retention.timer
            sudo systemctl restart ctrip-scraper.timer ctrip-parser.timer ctrip-retention.timer || true
            sleep 2
            sudo pkill -9 -f 'uvicorn web.server:app' 2>/dev/null || true
            sudo systemctl restart ctrip-web.service
            sleep 3

            # 首次部署：DB 不存在则用 .env 里 API_SECRET 初始化（保留已有 DB）
            if [[ ! -f data/monitor.db ]] && [[ -n "${API_SECRET}" ]]; then
              .venv/bin/python scripts/init_db.py --db data/monitor.db \
                --api-secret "${API_SECRET}" --admin-password "${CTRIP_ADMIN_PASSWORD:-changeme}"
              echo "✓ DB initialized"
            fi

            # caddy — 三步，CI 只动两个文件：
            #   1) /etc/caddy/Caddyfile 仅当完全缺失 / 没有 import 行（首次/恢复）
            #   2) /etc/caddy/sites/ctrip.caddy diff 不同才同步（带 .bak 备份）
            #   3) 其他 .caddy（feizhu 等）我们永不碰
            if command -v caddy >/dev/null 2>&1; then
              sudo mkdir -p /etc/caddy/sites

              # 1) 主 Caddyfile 健康检查（不覆盖，只补 import）
              if [[ ! -f /etc/caddy/Caddyfile ]]; then
                echo "caddy: 主 Caddyfile 不存在 → 用 deploy/Caddyfile.main 初始化"
                sudo cp deploy/Caddyfile.main /etc/caddy/Caddyfile
                CHANGED=1
              elif ! sudo grep -qE '^\s*import\s+/etc/caddy/sites' /etc/caddy/Caddyfile; then
                echo "caddy: 主 Caddyfile 缺 import → 备份并追加"
                sudo cp /etc/caddy/Caddyfile "/etc/caddy/Caddyfile.bak.$(date -u +%Y%m%d-%H%M%S)"
                sudo bash -c 'printf "\nimport /etc/caddy/sites/*.caddy\n" >> /etc/caddy/Caddyfile'
                CHANGED=1
              fi

              # 2) 站点文件 diff 同步
              if ! sudo diff -q deploy/sites/ctrip.caddy /etc/caddy/sites/ctrip.caddy >/dev/null 2>&1; then
                echo "caddy: sites/ctrip.caddy 有更新"
                if [[ -f /etc/caddy/sites/ctrip.caddy ]]; then
                  sudo cp /etc/caddy/sites/ctrip.caddy "/etc/caddy/sites/ctrip.caddy.bak.$(date -u +%Y%m%d-%H%M%S)"
                fi
                sudo cp deploy/sites/ctrip.caddy /etc/caddy/sites/ctrip.caddy
                CHANGED=1
              fi

              # 3) 有变更才 reload
              if [[ "${CHANGED:-0}" == "1" ]]; then
                sudo systemctl reload caddy || true
              else
                echo "caddy: 无变更，跳过 reload"
              fi
            else
              echo "WARN: caddy not installed; skipping Caddyfile sync"
            fi

            # 端口 / DNS 自检
            echo "=== listening ports ==="
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':(80|443|8000)\b' || echo "no listener on 80/443/8000"
            echo "=== public IP ==="
            curl -sf --max-time 5 https://api.ipify.org || echo "(ipify unreachable)"
            echo

            # 健康检查
            sleep 3
            curl -sf http://127.0.0.1:8000/healthz || (echo "healthz failed"; sudo journalctl -u ctrip-web -n 30 --no-pager; exit 1)
            echo "DEPLOY OK"
          REMOTE

      - name: Summary
        if: success()
        run: |
          echo "✅ Deploy complete. Health: http://${{ secrets.VPS_HOST }}/healthz"

      - name: Vendor add (16540)
        if: success()
        env:
          VPS_USER: ${{ secrets.VPS_USER || 'ctrip' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CTRIP_DB_PATH: /opt/ctrip-price-monitor/data/monitor.db
        run: |
          mkdir -p ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 2>/dev/null || true
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd /opt/ctrip-price-monitor && CTRIP_DB_PATH=$CTRIP_DB_PATH .venv/bin/python scripts/vendor_add.py 16540 vendor-16540"