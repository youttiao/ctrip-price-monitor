{% extends "base.html" %}
{% block title %}Webhook 配置 · 携程哨兵{% endblock %}
{% block body %}
<div class="page">

  <div class="page-header">
    <div>
      <h1>Webhook 配置</h1>
      <div class="sub muted">告警会通过 HMAC-SHA256 签名 POST 到此 URL</div>
    </div>
    <div>
      <a href="/admin/api-secret" class="btn ghost sm">API Secret →</a>
    </div>
  </div>

  <div class="card" style="max-width:560px">
    <form method="post" action="/admin/config/webhook">
      <div class="form-row">
        <label>URL</label>
        <input type="url" name="webhook_url" value="{{ config.webhook_url|default('', true) }}" placeholder="https://your-webhook/...">
      </div>
      <div class="form-row">
        <label>Secret</label>
        <input type="text" name="webhook_secret" placeholder="留空则不修改">
      </div>
      <div class="form-row">
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>

    <div class="muted mt-4" style="font-size:var(--fs-xs)">
      签名 header：<code>X-Ctrip-Signature: sha256=&lt;hex&gt;</code><br>
      签名内容：<code>HMAC-SHA256(secret, body)</code>
    </div>
  </div>

</div>
{% endblock %}
