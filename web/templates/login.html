{% extends "base.html" %}
{% block title %}登录 · 携程哨兵{% endblock %}
{% block body %}

<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="chop">哨</span>
      <div class="name">携程哨兵<span class="light">私人哨位</span></div>
    </div>

    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-row">
        <label>账号</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-row" style="margin-top:var(--sp-5)">
        <button class="btn primary" type="submit" style="flex:1; justify-content:center">登录</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
