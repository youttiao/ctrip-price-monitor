<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>携程哨兵 · 采集器</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; padding: 12px; min-width: 320px; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-size: 11px; color: #555; margin: 8px 0 2px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 12px; }
    button { padding: 6px 12px; margin: 4px 0; border: 1px solid #ccc; background: #f7f7f7; border-radius: 4px; cursor: pointer; }
    button.primary { background: #4c9aff; color: white; border-color: #4c9aff; }
    .row { margin-bottom: 8px; }
    .status { font-size: 11px; padding: 6px; border-radius: 4px; margin-top: 8px; }
    .status.ok { background: #e8f5e8; color: #2c7a2c; }
    .status.err { background: #fde4e4; color: #b22; }
  </style>
</head>
<body>
<h1>🛰 携程哨兵 · 采集器</h1>

<div class="row">
  <label>Server URL</label>
  <input id="server" placeholder="http://127.0.0.1:8000 或 https://xiecheng.19880913.xyz">
</div>
<div class="row">
  <label>Ingest Secret</label>
  <input id="ingestSecret" placeholder="X-Ingest-Secret 头">
</div>
<div class="row">
  <label>Cookie Sync Secret</label>
  <input id="cookieSecret" placeholder="X-Cookie-Secret 头">
</div>
<div class="row">
  <button class="primary" id="save">保存配置</button>
  <button id="syncNow">立即同步 cookie</button>
</div>
<div class="row">
  <button id="captureNow">在当前 tab 抓一轮</button>
</div>

<div id="status" class="status" style="display:none"></div>

<script src="popup.js"></script>
</body>
</html>
