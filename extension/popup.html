<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>携程哨兵 · 采集器</title>
  <style>
    :root {
      --ink: #0E1116;
      --ink-2: #161A22;
      --paper: #F2EBD8;
      --paper-mute: #9A9385;
      --amber: #E89B30;
      --amber-hi: #F5A848;
      --slate: #5B6470;
      --green: #5A8F6E;
      --red: #C2443A;
      --serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
      --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
      --ui: -apple-system, BlinkMacSystemFont, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--paper);
      font: 13px/1.5 var(--ui);
      width: 360px;
      padding: 16px 18px 14px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: .01em;
    }

    /* ---------- HEADER ---------- */
    header { position: relative; margin-bottom: 14px; }
    header::before {
      content: "";
      display: block;
      height: 2px;
      background: linear-gradient(90deg, var(--amber) 0%, var(--amber) 35%, transparent 100%);
      margin-bottom: 10px;
    }
    .mark {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .04em;
      color: var(--paper);
      margin: 0;
      line-height: 1.1;
    }
    .mark small {
      display: block;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 9.5px;
      color: var(--paper-mute);
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .clock {
      position: absolute; right: 0; top: 12px;
      font: 10px/1 var(--mono);
      color: var(--paper-mute);
      letter-spacing: .1em;
      text-align: right;
    }
    .clock b {
      display: block;
      color: var(--amber);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: .05em;
      margin-top: 2px;
    }

    /* ---------- SECTION ---------- */
    section { margin-bottom: 14px; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--paper-mute);
      letter-spacing: .22em;
      text-transform: uppercase;
      margin: 0 0 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .eyebrow::before {
      content: ""; width: 6px; height: 6px;
      background: var(--amber); display: inline-block;
    }
    .eyebrow::after {
      content: ""; flex: 1; height: 1px;
      background: var(--slate); opacity: .35;
    }

    /* ---------- INPUT ---------- */
    label {
      display: block;
      font: 10px/1 var(--mono);
      color: var(--paper-mute);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 10px 0 4px;
    }
    input {
      width: 100%;
      background: var(--ink-2);
      color: var(--paper);
      border: 1px solid var(--slate);
      border-radius: 2px;
      padding: 8px 10px;
      font: 12px/1.4 var(--mono);
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--amber); }
    input::placeholder { color: var(--slate); }
    .hint {
      font: 10px/1.5 var(--mono);
      color: var(--paper-mute);
      margin-top: 4px;
      letter-spacing: .04em;
    }

    /* ---------- BUTTON ---------- */
    button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border-radius: 2px;
      border: 1px solid var(--slate);
      background: transparent;
      color: var(--paper);
      font: 12px/1 var(--ui);
      letter-spacing: .08em;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    button:hover:not(:disabled) { border-color: var(--paper); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .3; cursor: not-allowed; }
    button.primary {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--ink);
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--amber-hi); border-color: var(--amber-hi); }
    .btn-row { display: flex; gap: 6px; margin-top: 10px; }
    .btn-row > button { flex: 1; padding: 9px 10px; }

    /* ---------- POI PANEL ---------- */
    .poi-panel {
      background: var(--ink-2);
      border: 1px solid var(--slate);
      border-radius: 2px;
      padding: 12px 12px 10px;
    }
    .poi-panel.empty { text-align: left; padding: 14px 12px; }
    .poi-name {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 17px;
      color: var(--paper);
      margin: 0;
      line-height: 1.2;
    }
    .poi-meta {
      display: flex;
      gap: 8px; align-items: center;
      margin-top: 6px;
      font: 10px/1.4 var(--mono);
      color: var(--paper-mute);
      letter-spacing: .06em;
      flex-wrap: wrap;
    }
    .poi-meta .id { color: var(--amber); }
    .poi-meta .dot { color: var(--slate); }
    .poi-status {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--slate);
      font: 11px/1.5 var(--mono);
      color: var(--paper);
      letter-spacing: .02em;
    }
    .poi-status.ok  { color: var(--green); }
    .poi-status.err { color: var(--red); }
    .poi-status.run { color: var(--amber); }
    .poi-status .count { color: var(--amber); }
    .poi-status .mute  { color: var(--paper-mute); opacity: .7; font-size: 10px; }
    .poi-status .err   { color: var(--red); }
    .poi-status .t-done { color: var(--green); }
    .poi-status .t-pend { color: var(--amber); }
    .poi-status .t-err  { color: var(--red); }
    .poi-status .t-miss { color: var(--paper-mute); opacity: .6; }
    .poi-status .t-done,
    .poi-status .t-pend,
    .poi-status .t-err,
    .poi-status .t-miss { font-size: 10.5px; line-height: 1.45; padding-left: 6px; }

    /* ---------- STREAM LOG (tape reader) ---------- */
    /* 概念：磁带阅读机 — 倒序滚屏（最新在顶），mono 字体固定列宽，
       每个 endpoint 一个彩色 chip，新事件 fade-in 高亮 1.5s 后回归普通色。 */
    .stream {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--slate);
    }
    .stream-ticker {
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 2px 6px;
      font: 10px/1.4 var(--mono);
      color: var(--paper-mute);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .stream-ticker .pulse {
      width: 7px; height: 7px;
      background: var(--amber);
      border-radius: 50%;
      display: inline-block;
      animation: ctripPulse 1.4s ease-in-out infinite;
    }
    .stream-ticker .pulse.done { background: var(--green); animation: none; }
    .stream-ticker .pulse.err  { background: var(--red); animation: none; }
    .stream-ticker .pulse.idle { background: var(--slate); animation: none; }
    .stream-ticker .cnt  { color: var(--amber); font-weight: 600; }
    .stream-ticker .sep  { opacity: .4; }
    .stream-ticker .elap { color: var(--paper); }
    @keyframes ctripPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .35; transform: scale(1.3); }
    }
    .stream-body {
      max-height: 180px;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--ink-2);
      border: 1px solid var(--slate);
      border-radius: 2px;
      padding: 4px 0;
      /* 倒序：CSS column-reverse 让最新 push 在顶 */
      display: flex; flex-direction: column-reverse;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--slate) transparent;
    }
    .stream-body::-webkit-scrollbar { width: 4px; }
    .stream-body::-webkit-scrollbar-thumb { background: var(--slate); }
    .stream-body::-webkit-scrollbar-track { background: transparent; }
    .stream-empty {
      padding: 16px 10px;
      text-align: center;
      font: 10px/1.4 var(--mono);
      color: var(--paper-mute);
      opacity: .55;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .ev {
      display: flex; align-items: baseline; gap: 6px;
      padding: 2px 8px;
      font: 10.5px/1.4 var(--mono);
      color: var(--paper);
      letter-spacing: .02em;
      border-left: 2px solid transparent;
      animation: evFade 1.6s ease-out;
    }
    @keyframes evFade {
      0%   { background: rgba(232, 155, 48, .18); border-left-color: var(--amber); }
      100% { background: transparent; border-left-color: transparent; }
    }
    .ev .ts  { color: var(--paper-mute); opacity: .65; flex-shrink: 0; width: 44px; }
    .ev .tag {
      flex-shrink: 0; padding: 1px 5px; border-radius: 2px;
      font-size: 9px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; line-height: 1.3;
    }
    .ev .tag.addInfo        { background: rgba(232,155,48,.18); color: var(--amber); }
    .ev .tag.priceCal       { background: rgba(90,143,110,.18); color: var(--green); }
    .ev .tag.resourceDetail { background: rgba(242,235,216,.10); color: var(--paper-mute); }
    .ev .tag.shelfResList   { background: rgba(95,175,176,.18); color: #7FC8C9; }
    .ev .tag.priceCal-sibling,
    .ev .tag.resourceDetail-sibling {
      background: rgba(95,175,176,.10); color: #7FC8C9; opacity: .85;
    }
    .ev .tag.phase { background: rgba(232,155,48,.30); color: var(--amber); }
    .ev .tag.info  { background: transparent; color: var(--paper-mute); }
    .ev .tag.skip  { background: rgba(194,68,58,.18); color: var(--red); }
    .ev .ident    { color: var(--paper); flex: 1; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .ev .ident .rid { color: var(--paper-mute); }
    .ev .ident .pid { color: var(--amber); }
    .ev .glyph { flex-shrink: 0; width: 14px; text-align: right; font-weight: 700; }
    .ev .glyph.ok           { color: var(--green); }
    .ev .glyph.err          { color: var(--red); }
    .ev .glyph.warn         { color: var(--amber); }
    .ev .glyph.rate_limited { color: var(--red); }
    .ev .glyph.started      { color: var(--paper-mute); opacity: .5; }
    .ev.muted { opacity: .55; }
    .ev.muted .ident { color: var(--paper-mute); }

    /* ---------- GUIDE LINK ---------- */
    .guide {
      font: 11.5px/1.65 var(--ui);
      color: var(--paper-mute);
    }
    .guide b {
      color: var(--paper);
      font-weight: 600;
    }
    .guide a {
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px dashed var(--amber);
      font-family: var(--mono);
      font-size: 11px;
    }
    .guide a:hover { color: var(--amber-hi); border-color: var(--amber-hi); }

    /* ---------- STATUS (terminal footer) ---------- */
    .status {
      font: 10.5px/1.55 var(--mono);
      color: var(--paper-mute);
      padding: 9px 11px;
      border-left: 2px solid var(--slate);
      background: rgba(242, 235, 216, .03);
      letter-spacing: .02em;
    }
    .status.ok  { border-left-color: var(--green); color: var(--paper); }
    .status.err { border-left-color: var(--red); color: var(--paper); }
    .status.run {
      border-left-color: var(--amber); color: var(--paper);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="mark">携程哨兵<small>SENTRY · COLLECTOR</small></div>
    <div class="clock"><span id="clockText">--:--:--</span><b id="verText"></b></div>
  </header>

  <section>
    <div class="eyebrow">接入</div>
    <label>Server URL</label>
    <input id="server" placeholder="https://xiecheng.19880913.xyz" autocomplete="off" spellcheck="false">
    <label>API Secret</label>
    <input id="apiSecret" type="password" placeholder="X-API-Secret 粘贴即可" autocomplete="off" spellcheck="false">
    <div class="hint">在 dashboard 管理 → API Secret 页面查看</div>
    <div class="btn-row">
      <button id="save">保存配置</button>
    </div>
  </section>

  <section>
    <div class="eyebrow">同步 Cookie</div>
    <button class="primary" id="syncNow">打开携程登录页并同步</button>
    <div class="hint">会打开 m.ctrip.com 登录 → 检测到 GUID 后自动上传。最多等 90 秒。</div>
  </section>

  <section>
    <div class="eyebrow">当前 POI</div>
    <div id="poiPanel"></div>
  </section>

  <div id="status" class="status" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
